<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>电脑遥控</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    touch-action: none;
    -webkit-overflow-scrolling: touch;
    position: fixed;
    width: 100%;
}

/* Safe area support */
body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
}

#app-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
    overflow: hidden;
}

#screen-area {
    width: 100%;
    height: 40%;
    min-height: 80px;
    overflow: hidden;
    position: relative;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: height 0.3s ease;
}
#screen-area.gamepad-mode { height: 22%; }

#screen-container {
    position: absolute;
    transform-origin: 0 0;
    will-change: transform;
}

#screen-img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
}

#touchpad {
    width: 100%;
    flex: 1;
    min-height: 80px;
    background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
    position: relative;
    touch-action: none;
    transition: all 0.3s ease;
}
#touchpad.gamepad-mode {
    flex: none;
    height: 55px;
    min-height: 55px;
}

#touchpad-hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.15);
    font-size: 13px;
    pointer-events: none;
    text-align: center;
    line-height: 2;
}
#touchpad.gamepad-mode #touchpad-hint { display: none; }

#toolbar {
    height: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    background: #0a0a1a;
    border-top: 1px solid #333;
    flex-shrink: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    z-index: 10;
}

.tool-btn {
    color: #ccc;
    font-size: 12px;
    padding: 6px 10px;
    border: 1px solid #555;
    border-radius: 6px;
    background: #222;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
}
.tool-btn:active { background: #555; color: #fff; }
.tool-btn.danger { border-color: #833; color: #f66; }
.tool-btn.danger:active { background: #600; }
.tool-btn.active { background: #1a6; border-color: #1a6; color: #fff; }

#status-bar {
    position: relative;
    width: 100%;
    height: 22px;
    min-height: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    background: rgba(0,0,0,0.85);
    z-index: 999;
    font-size: 11px;
    flex-shrink: 0;
}
#status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #f00;
    margin-right: 5px;
    display: inline-block;
}
#status-dot.on { background: #0f0; }
#status-text { color: #aaa; }
#fps-text { color: #888; }
#mode-indicator { color: #6cf; font-size: 10px; }

/* Gamepad area */
#gamepad-area {
    display: none;
    width: 100%;
    position: relative;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    touch-action: none;
    overflow: hidden;
    flex-shrink: 0;
}
#gamepad-area.visible {
    display: block;
    height: calc(78% - 22px - 44px - 55px);
    min-height: 160px;
}

.dpad-container {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 130px;
    height: 130px;
}

.dpad-btn {
    position: absolute;
    width: 42px;
    height: 42px;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
}
.dpad-btn.pressed { background: rgba(80,200,120,0.6); border-color: #4c4; transform: scale(0.92); }
.dpad-up { left: 44px; top: 0; }
.dpad-down { left: 44px; bottom: 0; }
.dpad-left { left: 0; top: 44px; }
.dpad-right { right: 0; top: 44px; }

.abxy-container {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 130px;
    height: 130px;
}

.abxy-btn {
    position: absolute;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
}
.abxy-btn.pressed { background: rgba(80,120,220,0.6); border-color: #58f; transform: scale(0.92); }
.btn-x { left: 44px; top: 0; }
.btn-a { left: 44px; bottom: 0; }
.btn-y { left: 0; top: 44px; }
.btn-b { right: 0; top: 44px; }

.shoulder-container {
    position: absolute;
    top: 6px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 15px;
}

.shoulder-btn {
    width: 65px;
    height: 32px;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
}
.shoulder-btn.pressed { background: rgba(220,80,80,0.6); border-color: #f55; transform: scale(0.92); }

/* Keyboard input area */
#kb-wrapper {
    position: fixed;
    bottom: 50px;
    left: 10px;
    right: 10px;
    z-index: 900;
    display: none;
}
#kb-wrapper.visible { display: block; }

#kb-textarea {
    width: 100%;
    height: 44px;
    background: #222;
    border: 1px solid #1a6;
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    padding: 8px 12px;
    outline: none;
    resize: none;
    -webkit-appearance: none;
}

#kb-close-btn {
    position: absolute;
    top: -28px;
    right: 0;
    background: #555;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
}

/* Settings overlay */
#settings-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.9);
    z-index: 1000;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: calc(env(safe-area-inset-top, 0px) + 30px) 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
}
#settings-overlay.visible { display: block; }

.settings-title {
    color: #fff;
    font-size: 18px;
    margin-bottom: 16px;
    text-align: center;
}
.settings-group {
    margin-bottom: 16px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    padding: 12px;
}
.settings-group h3 {
    color: #aaa;
    font-size: 13px;
    margin-bottom: 8px;
}
.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}
.setting-row label {
    color: #ccc;
    font-size: 13px;
    flex: 1;
}
.setting-row input, .setting-row select {
    width: 120px;
    padding: 6px 8px;
    background: #333;
    border: 1px solid #555;
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
}
.settings-close-btn {
    display: block;
    margin: 16px auto 0;
    padding: 12px 40px;
    background: #1a6;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
}
.speed-indicator {
    color: #888;
    font-size: 11px;
    text-align: center;
    margin-top: 2px;
}
</style>
</head>
<body>

<div id="app-container">

<div id="status-bar">
    <span><span id="status-dot"></span><span id="status-text">未连接</span></span>
    <span id="mode-indicator">触控板模式</span>
    <span id="fps-text"></span>
</div>

<div id="screen-area">
    <div id="screen-container">
        <img id="screen-img" alt="">
    </div>
</div>

<div id="gamepad-area">
    <div class="shoulder-container">
        <div class="shoulder-btn" data-btn="L">L</div>
        <div class="shoulder-btn" data-btn="R">R</div>
    </div>
    <div class="dpad-container">
        <div class="dpad-btn dpad-up" data-btn="up">&#9650;</div>
        <div class="dpad-btn dpad-down" data-btn="down">&#9660;</div>
        <div class="dpad-btn dpad-left" data-btn="left">&#9664;</div>
        <div class="dpad-btn dpad-right" data-btn="right">&#9654;</div>
    </div>
    <div class="abxy-container">
        <div class="abxy-btn btn-x" data-btn="X">X</div>
        <div class="abxy-btn btn-a" data-btn="A">A</div>
        <div class="abxy-btn btn-y" data-btn="Y">Y</div>
        <div class="abxy-btn btn-b" data-btn="B">B</div>
    </div>
</div>

<div id="touchpad">
    <div id="touchpad-hint">单指滑动 = 移动鼠标<br>单击 = 左键 | 长按 = 右键<br>双指滑动 = 滚轮</div>
</div>

<div id="toolbar">
    <span class="tool-btn" id="btn-mode">手柄</span>
    <span class="tool-btn" id="btn-left">左键</span>
    <span class="tool-btn" id="btn-middle">中键</span>
    <span class="tool-btn" id="btn-right">右键</span>
    <span class="tool-btn" id="btn-keyboard">键盘</span>
    <span class="tool-btn" id="btn-settings">设置</span>
    <span class="tool-btn danger" id="btn-shutdown">关闭</span>
</div>

</div>

<!-- Keyboard input wrapper -->
<div id="kb-wrapper">
    <button id="kb-close-btn">收起键盘</button>
    <textarea id="kb-textarea" rows="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="输入文字（支持中文）..."></textarea>
</div>

<!-- Settings overlay -->
<div id="settings-overlay">
    <div class="settings-title">设置</div>
    <div class="settings-group">
        <h3>鼠标速度</h3>
        <div class="setting-row">
            <label>灵敏度</label>
            <input type="range" id="set-mouse-speed" min="0.5" max="5" step="0.1" value="1.8">
        </div>
        <div class="speed-indicator" id="speed-val">1.8x</div>
    </div>
    <div class="settings-group">
        <h3>方向键映射</h3>
        <div class="setting-row"><label>上</label><input type="text" data-map="up" value="up" maxlength="20"></div>
        <div class="setting-row"><label>下</label><input type="text" data-map="down" value="down" maxlength="20"></div>
        <div class="setting-row"><label>左</label><input type="text" data-map="left" value="left" maxlength="20"></div>
        <div class="setting-row"><label>右</label><input type="text" data-map="right" value="right" maxlength="20"></div>
    </div>
    <div class="settings-group">
        <h3>ABXY 按键映射</h3>
        <div class="setting-row"><label>A</label><input type="text" data-map="A" value="j" maxlength="20"></div>
        <div class="setting-row"><label>B</label><input type="text" data-map="B" value="k" maxlength="20"></div>
        <div class="setting-row"><label>X</label><input type="text" data-map="X" value="l" maxlength="20"></div>
        <div class="setting-row"><label>Y</label><input type="text" data-map="Y" value=";" maxlength="20"></div>
    </div>
    <div class="settings-group">
        <h3>肩键映射</h3>
        <div class="setting-row"><label>L (左肩)</label><input type="text" data-map="L" value="space" maxlength="20"></div>
        <div class="setting-row"><label>R (右肩)</label><input type="text" data-map="R" value="shift" maxlength="20"></div>
    </div>
    <button class="settings-close-btn" id="settings-close">保存并关闭</button>
</div>

<script>
(function() {
    'use strict';

    const screenArea = document.getElementById('screen-area');
    const screenContainer = document.getElementById('screen-container');
    const screenImg = document.getElementById('screen-img');
    const touchpad = document.getElementById('touchpad');
    const gamepadArea = document.getElementById('gamepad-area');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const fpsText = document.getElementById('fps-text');
    const modeIndicator = document.getElementById('mode-indicator');
    const settingsOverlay = document.getElementById('settings-overlay');
    const kbWrapper = document.getElementById('kb-wrapper');
    const kbTextarea = document.getElementById('kb-textarea');

    let ws = null;
    let frameCount = 0;
    let fpsTimer = Date.now();
    let isGamepadMode = false;

    // --- Key mappings ---
    let keyMap = {
        up: 'up', down: 'down', left: 'left', right: 'right',
        A: 'j', B: 'k', X: 'l', Y: ';',
        L: 'space', R: 'shift'
    };

    let mouseSpeed = 1.8;

    // --- Settings persistence ---
    function loadSettings() {
        try {
            const saved = localStorage.getItem('myconnect_keymap');
            if (saved) Object.assign(keyMap, JSON.parse(saved));
            const speed = localStorage.getItem('myconnect_mouse_speed');
            if (speed) mouseSpeed = parseFloat(speed);
        } catch(e) {}
    }

    function saveSettings() {
        localStorage.setItem('myconnect_keymap', JSON.stringify(keyMap));
        localStorage.setItem('myconnect_mouse_speed', String(mouseSpeed));
    }

    function applySettingsToUI() {
        document.querySelectorAll('[data-map]').forEach(input => {
            const key = input.getAttribute('data-map');
            if (keyMap[key] !== undefined) input.value = keyMap[key];
        });
        document.getElementById('set-mouse-speed').value = mouseSpeed;
        document.getElementById('speed-val').textContent = mouseSpeed.toFixed(1) + 'x';
    }

    function readSettingsFromUI() {
        document.querySelectorAll('[data-map]').forEach(input => {
            const key = input.getAttribute('data-map');
            const val = input.value.trim();
            if (val) keyMap[key] = val;
        });
        mouseSpeed = parseFloat(document.getElementById('set-mouse-speed').value) || 1.8;
    }

    loadSettings();

    // --- Image zoom/pan state ---
    let imgScale = 1;
    let imgX = 0, imgY = 0;
    let naturalW = 0, naturalH = 0;

    // --- WebSocket ---
    function connect() {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        ws = new WebSocket(`${proto}://${location.host}/ws/control`);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
            statusDot.classList.add('on');
            statusText.textContent = '已连接';
        };

        ws.onclose = () => {
            statusDot.classList.remove('on');
            statusText.textContent = '已断开';
            setTimeout(connect, 2000);
        };

        ws.onerror = () => ws.close();

        ws.onmessage = (e) => {
            if (e.data instanceof ArrayBuffer) {
                const blob = new Blob([e.data], {type: 'image/jpeg'});
                const url = URL.createObjectURL(blob);
                const oldUrl = screenImg.src;
                screenImg.onload = () => {
                    if (oldUrl && oldUrl.startsWith('blob:')) URL.revokeObjectURL(oldUrl);
                    if (naturalW === 0) fitImage();
                    naturalW = screenImg.naturalWidth;
                    naturalH = screenImg.naturalHeight;
                };
                screenImg.src = url;

                frameCount++;
                const now = Date.now();
                if (now - fpsTimer >= 1000) {
                    fpsText.textContent = frameCount + ' FPS';
                    frameCount = 0;
                    fpsTimer = now;
                }
            }
        };
    }

    function send(obj) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(obj));
        }
    }

    // --- Image fit ---
    function fitImage() {
        imgScale = 1;
        imgX = 0;
        imgY = 0;
        screenContainer.style.transform = '';
        screenImg.style.maxWidth = screenArea.clientWidth + 'px';
        screenImg.style.maxHeight = screenArea.clientHeight + 'px';
    }

    function applyImgTransform() {
        screenContainer.style.transform = `translate(${imgX}px, ${imgY}px) scale(${imgScale})`;
    }

    // --- Screen area: pinch zoom + pan ---
    let screenPinchDist = 0;
    let screenPanStartX = 0, screenPanStartY = 0;
    let screenStartImgX = 0, screenStartImgY = 0;
    let screenPinchStartScale = 1;

    screenArea.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length === 2) {
            screenPinchDist = pinchDist(e.touches);
            screenPinchStartScale = imgScale;
        } else if (e.touches.length === 1) {
            screenPanStartX = e.touches[0].clientX;
            screenPanStartY = e.touches[0].clientY;
            screenStartImgX = imgX;
            screenStartImgY = imgY;
        }
    }, {passive: false});

    screenArea.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 2) {
            const dist = pinchDist(e.touches);
            imgScale = Math.min(8, Math.max(0.5, screenPinchStartScale * (dist / screenPinchDist)));
            applyImgTransform();
        } else if (e.touches.length === 1 && imgScale > 1) {
            const dx = e.touches[0].clientX - screenPanStartX;
            const dy = e.touches[0].clientY - screenPanStartY;
            imgX = screenStartImgX + dx;
            imgY = screenStartImgY + dy;
            applyImgTransform();
        }
    }, {passive: false});

    screenArea.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (e.touches.length === 0 && imgScale <= 1) fitImage();
    }, {passive: false});

    let lastTapTime = 0;
    screenArea.addEventListener('click', () => {
        const now = Date.now();
        if (now - lastTapTime < 300) fitImage();
        lastTapTime = now;
    });

    function pinchDist(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    // --- Touchpad logic (identifier-based tracking) ---
    const activeTouches = new Map();
    let tapStartTime = 0, hasMoved = false;
    let longPressTimer = null;
    let isLongPress = false;
    let lastMoveTime = 0;
    let scrollPendingV = 0, scrollPendingH = 0;
    let scrollRAF = null;

    function flushScroll() {
        scrollRAF = null;
        if (Math.abs(scrollPendingV) >= 1) {
            send({type: 'scroll', delta: Math.round(scrollPendingV)});
            scrollPendingV = 0;
        }
        if (Math.abs(scrollPendingH) >= 1) {
            send({type: 'hscroll', delta: Math.round(scrollPendingH)});
            scrollPendingH = 0;
        }
    }

    function scheduleScrollFlush() {
        if (!scrollRAF) scrollRAF = requestAnimationFrame(flushScroll);
    }

    function getTouchCount() { return activeTouches.size; }

    touchpad.addEventListener('touchstart', (e) => {
        e.preventDefault();
        for (const t of e.changedTouches) {
            activeTouches.set(t.identifier, {x: t.clientX, y: t.clientY, time: Date.now()});
        }

        if (getTouchCount() === 1) {
            const t = e.changedTouches[0];
            tapStartTime = Date.now();
            hasMoved = false;
            isLongPress = false;
            longPressTimer = setTimeout(() => {
                if (!hasMoved && getTouchCount() === 1) {
                    isLongPress = true;
                    send({type: 'click', button: 'right'});
                    if (navigator.vibrate) navigator.vibrate(50);
                }
            }, 500);
        } else if (getTouchCount() >= 2) {
            clearTimeout(longPressTimer);
        }
    }, {passive: false});

    touchpad.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const now = Date.now();

        for (const t of e.changedTouches) {
            const prev = activeTouches.get(t.identifier);
            if (prev) {
                prev.prevX = prev.x;
                prev.prevY = prev.y;
                prev.prevTime = prev.time;
                prev.x = t.clientX;
                prev.y = t.clientY;
                prev.time = now;
            }
        }

        if (getTouchCount() >= 2) {
            clearTimeout(longPressTimer);
            const entries = [...activeTouches.values()];
            let sumDx = 0, sumDy = 0, count = 0;
            for (const entry of entries) {
                if (entry.prevX !== undefined) {
                    sumDx += entry.x - entry.prevX;
                    sumDy += entry.y - entry.prevY;
                    count++;
                }
            }
            if (count > 0) {
                const avgDx = sumDx / count;
                const avgDy = sumDy / count;
                const dt = Math.max(1, now - (entries[0].prevTime || now));
                const speed = Math.sqrt(avgDx*avgDx + avgDy*avgDy) / dt;
                const speedFactor = Math.max(1, speed * 2.5);

                scrollPendingV += -(avgDy / 12) * speedFactor;
                scrollPendingH += (avgDx / 12) * speedFactor;
                scheduleScrollFlush();
            }
            return;
        }

        if (getTouchCount() === 1) {
            const entry = [...activeTouches.values()][0];
            if (entry && entry.prevX !== undefined) {
                const dx = entry.x - entry.prevX;
                const dy = entry.y - entry.prevY;
                if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                    hasMoved = true;
                    clearTimeout(longPressTimer);
                    if (now - lastMoveTime > 12) {
                        send({type: 'move', dx: Math.round(dx * mouseSpeed), dy: Math.round(dy * mouseSpeed)});
                        lastMoveTime = now;
                    }
                }
            }
        }
    }, {passive: false});

    touchpad.addEventListener('touchend', (e) => {
        e.preventDefault();
        for (const t of e.changedTouches) {
            activeTouches.delete(t.identifier);
        }
        clearTimeout(longPressTimer);

        if (getTouchCount() === 0) {
            if (scrollRAF) { cancelAnimationFrame(scrollRAF); scrollRAF = null; }
            if (scrollPendingV || scrollPendingH) flushScroll();

            if (!hasMoved && !isLongPress && activeTouches.size === 0) {
                const elapsed = Date.now() - tapStartTime;
                if (elapsed < 250) {
                    send({type: 'click', button: 'left'});
                }
            }
            isLongPress = false;
        }
    }, {passive: false});

    touchpad.addEventListener('touchcancel', (e) => {
        for (const t of e.changedTouches) {
            activeTouches.delete(t.identifier);
        }
        clearTimeout(longPressTimer);
        isLongPress = false;
        if (scrollRAF) { cancelAnimationFrame(scrollRAF); scrollRAF = null; }
        scrollPendingV = 0; scrollPendingH = 0;
    });

    // --- Gamepad buttons (multi-touch safe) ---
    function setupGamepadButtons() {
        const allBtns = gamepadArea.querySelectorAll('[data-btn]');
        const activeMap = new Map();

        function getButtonForTouch(touch) {
            const el = document.elementFromPoint(touch.clientX, touch.clientY);
            if (!el) return null;
            return el.closest('[data-btn]');
        }

        gamepadArea.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (const touch of e.changedTouches) {
                const btn = getButtonForTouch(touch);
                if (btn) {
                    const btnName = btn.getAttribute('data-btn');
                    activeMap.set(touch.identifier, {btn, btnName});
                    btn.classList.add('pressed');
                    const key = keyMap[btnName];
                    if (key) send({type: 'keydown', key: key});
                }
            }
        }, {passive: false});

        gamepadArea.addEventListener('touchend', (e) => {
            e.preventDefault();
            for (const touch of e.changedTouches) {
                const entry = activeMap.get(touch.identifier);
                if (entry) {
                    entry.btn.classList.remove('pressed');
                    const key = keyMap[entry.btnName];
                    if (key) send({type: 'keyup', key: key});
                    activeMap.delete(touch.identifier);
                }
            }
        }, {passive: false});

        gamepadArea.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            for (const touch of e.changedTouches) {
                const entry = activeMap.get(touch.identifier);
                if (entry) {
                    entry.btn.classList.remove('pressed');
                    const key = keyMap[entry.btnName];
                    if (key) send({type: 'keyup', key: key});
                    activeMap.delete(touch.identifier);
                }
            }
        }, {passive: false});

        gamepadArea.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, {passive: false});
    }
    setupGamepadButtons();

    // --- Mode switching ---
    const btnMode = document.getElementById('btn-mode');

    function setGamepadMode(active) {
        isGamepadMode = active;
        if (active) {
            screenArea.classList.add('gamepad-mode');
            touchpad.classList.add('gamepad-mode');
            gamepadArea.classList.add('visible');
            btnMode.classList.add('active');
            btnMode.textContent = '触控';
            modeIndicator.textContent = '手柄模式';
        } else {
            screenArea.classList.remove('gamepad-mode');
            touchpad.classList.remove('gamepad-mode');
            gamepadArea.classList.remove('visible');
            btnMode.classList.remove('active');
            btnMode.textContent = '手柄';
            modeIndicator.textContent = '触控板模式';
        }
        setTimeout(fitImage, 350);
    }

    btnMode.addEventListener('click', (e) => {
        e.stopPropagation();
        setGamepadMode(!isGamepadMode);
    });

    // --- Toolbar buttons ---
    document.getElementById('btn-left').addEventListener('click', (e) => {
        e.stopPropagation();
        send({type: 'click', button: 'left'});
    });
    document.getElementById('btn-middle').addEventListener('click', (e) => {
        e.stopPropagation();
        send({type: 'click', button: 'middle'});
    });
    document.getElementById('btn-right').addEventListener('click', (e) => {
        e.stopPropagation();
        send({type: 'click', button: 'right'});
    });

    document.getElementById('btn-keyboard').addEventListener('click', (e) => {
        e.stopPropagation();
        if (kbWrapper.classList.contains('visible')) {
            hideKeyboard();
        } else {
            showKeyboard();
        }
    });

    document.getElementById('btn-shutdown').addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm('确定要关闭电脑端遥控服务吗？')) {
            send({type: 'shutdown'});
            statusText.textContent = '服务已关闭';
            statusDot.classList.remove('on');
        }
    });

    // --- Keyboard input (textarea for IME support) ---
    function showKeyboard() {
        kbWrapper.classList.add('visible');
        kbTextarea.value = '';
        setTimeout(() => kbTextarea.focus(), 100);
    }

    function hideKeyboard() {
        kbWrapper.classList.remove('visible');
        kbTextarea.blur();
    }

    document.getElementById('kb-close-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        hideKeyboard();
    });

    let composing = false;
    let lastCompositionText = '';

    kbTextarea.addEventListener('compositionstart', () => {
        composing = true;
        lastCompositionText = '';
    });

    kbTextarea.addEventListener('compositionupdate', (e) => {
        lastCompositionText = e.data || '';
    });

    kbTextarea.addEventListener('compositionend', (e) => {
        composing = false;
        const val = e.data || kbTextarea.value;
        if (val) {
            send({type: 'text', text: val});
        }
        kbTextarea.value = '';
        lastCompositionText = '';
    });

    kbTextarea.addEventListener('input', (e) => {
        if (composing) return;
        const val = kbTextarea.value;
        if (val) {
            send({type: 'text', text: val});
            kbTextarea.value = '';
        }
    });

    kbTextarea.addEventListener('keydown', (e) => {
        if (composing) return;
        const specialKeys = {
            'Enter': 'enter', 'Backspace': 'backspace', 'Escape': 'escape',
            'Tab': 'tab', 'ArrowUp': 'up', 'ArrowDown': 'down',
            'ArrowLeft': 'left', 'ArrowRight': 'right', 'Delete': 'delete',
            ' ': 'space'
        };
        if (specialKeys[e.key]) {
            e.preventDefault();
            send({type: 'key', key: specialKeys[e.key]});
        }
    });

    // --- Settings ---
    document.getElementById('btn-settings').addEventListener('click', (e) => {
        e.stopPropagation();
        applySettingsToUI();
        settingsOverlay.classList.add('visible');
    });

    document.getElementById('set-mouse-speed').addEventListener('input', function() {
        document.getElementById('speed-val').textContent = parseFloat(this.value).toFixed(1) + 'x';
    });

    document.getElementById('settings-close').addEventListener('click', () => {
        readSettingsFromUI();
        saveSettings();
        settingsOverlay.classList.remove('visible');
    });

    // --- Prevent iOS rubber-band scrolling ---
    document.body.addEventListener('touchmove', (e) => {
        if (e.target === document.body || e.target === document.documentElement) {
            e.preventDefault();
        }
    }, {passive: false});

    // --- Handle visual viewport changes (virtual keyboard appearing) ---
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            if (imgScale <= 1) fitImage();
        });
    }

    window.addEventListener('resize', () => {
        if (imgScale <= 1) fitImage();
    });

    // --- Startup ---
    connect();
    applySettingsToUI();
})();
</script>
</body>
</html>
