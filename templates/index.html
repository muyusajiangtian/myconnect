<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>电脑遥控</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: #1a1a2e; font-family: -apple-system, sans-serif; touch-action: none; }

#screen-area {
    width: 100%;
    height: 50vh;
    overflow: hidden;
    position: relative;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
}

#screen-container {
    position: absolute;
    transform-origin: 0 0;
    will-change: transform;
}

#screen-img {
    display: block;
    max-width: 100vw;
    max-height: 50vh;
    width: auto;
    height: auto;
    object-fit: contain;
}

#touchpad {
    width: 100%;
    height: calc(50vh - 44px);
    background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
    position: relative;
    touch-action: none;
}

#touchpad-hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.15);
    font-size: 14px;
    pointer-events: none;
    text-align: center;
    line-height: 2;
}

#toolbar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    background: #0a0a1a;
    border-top: 1px solid #333;
    flex-shrink: 0;
}

.tool-btn {
    color: #ccc;
    font-size: 13px;
    padding: 6px 14px;
    border: 1px solid #555;
    border-radius: 6px;
    background: #222;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}
.tool-btn:active { background: #555; color: #fff; }
.tool-btn.danger { border-color: #833; color: #f66; }
.tool-btn.danger:active { background: #600; }

#keyboard-input {
    position: absolute;
    top: -200px;
    left: -200px;
    opacity: 0;
    width: 1px;
    height: 1px;
}

#status-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    background: rgba(0,0,0,0.7);
    z-index: 999;
    font-size: 10px;
}
#status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #f00;
    margin-right: 4px;
    display: inline-block;
}
#status-dot.on { background: #0f0; }
#status-text { color: #aaa; }
#fps-text { color: #888; }
</style>
</head>
<body>

<div id="status-bar">
    <span><span id="status-dot"></span><span id="status-text">未连接</span></span>
    <span id="fps-text"></span>
</div>

<div id="screen-area">
    <div id="screen-container">
        <img id="screen-img" alt="">
    </div>
</div>

<div id="touchpad">
    <div id="touchpad-hint">单指滑动 = 移动鼠标<br>单击 = 左键<br>双指滑动 = 滚轮</div>
</div>

<div id="toolbar">
    <span class="tool-btn" id="btn-left">左键</span>
    <span class="tool-btn" id="btn-right">右键</span>
    <span class="tool-btn" id="btn-scroll-up">滚▲</span>
    <span class="tool-btn" id="btn-scroll-down">滚▼</span>
    <span class="tool-btn" id="btn-keyboard">键盘</span>
    <span class="tool-btn danger" id="btn-shutdown">关闭</span>
</div>

<input id="keyboard-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

<script>
(function() {
    const screenArea = document.getElementById('screen-area');
    const screenContainer = document.getElementById('screen-container');
    const screenImg = document.getElementById('screen-img');
    const touchpad = document.getElementById('touchpad');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const fpsText = document.getElementById('fps-text');
    const kbInput = document.getElementById('keyboard-input');

    let ws = null;
    let frameCount = 0;
    let fpsTimer = Date.now();

    // --- 画面缩放/拖拽状态 ---
    let imgScale = 1;
    let imgX = 0, imgY = 0;
    let baseScale = 1;
    let naturalW = 0, naturalH = 0;

    // --- WebSocket ---
    function connect() {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        ws = new WebSocket(`${proto}://${location.host}/ws/control`);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
            statusDot.classList.add('on');
            statusText.textContent = '已连接';
        };

        ws.onclose = () => {
            statusDot.classList.remove('on');
            statusText.textContent = '已断开';
            setTimeout(connect, 2000);
        };

        ws.onerror = () => ws.close();

        ws.onmessage = (e) => {
            if (e.data instanceof ArrayBuffer) {
                const blob = new Blob([e.data], {type: 'image/jpeg'});
                const url = URL.createObjectURL(blob);
                const oldUrl = screenImg.src;
                screenImg.onload = () => {
                    if (oldUrl && oldUrl.startsWith('blob:')) URL.revokeObjectURL(oldUrl);
                    if (naturalW === 0) fitImage();
                    naturalW = screenImg.naturalWidth;
                    naturalH = screenImg.naturalHeight;
                };
                screenImg.src = url;

                frameCount++;
                const now = Date.now();
                if (now - fpsTimer >= 1000) {
                    fpsText.textContent = frameCount + ' FPS';
                    frameCount = 0;
                    fpsTimer = now;
                }
            }
        };
    }

    function send(obj) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(obj));
        }
    }

    // --- 画面自适应 ---
    function fitImage() {
        imgScale = 1;
        imgX = 0;
        imgY = 0;
        screenContainer.style.transform = '';
        screenImg.style.maxWidth = screenArea.clientWidth + 'px';
        screenImg.style.maxHeight = screenArea.clientHeight + 'px';
    }

    function applyImgTransform() {
        screenContainer.style.transform = `translate(${imgX}px, ${imgY}px) scale(${imgScale})`;
    }

    // --- 屏幕区域：双指缩放 + 单指拖拽 ---
    let screenPinchDist = 0;
    let screenPanStartX = 0, screenPanStartY = 0;
    let screenStartImgX = 0, screenStartImgY = 0;
    let screenPinchStartScale = 1;
    let screenPinchCenterX = 0, screenPinchCenterY = 0;

    screenArea.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length === 2) {
            screenPinchDist = pinchDist(e.touches);
            screenPinchStartScale = imgScale;
            screenPinchCenterX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            screenPinchCenterY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        } else if (e.touches.length === 1) {
            screenPanStartX = e.touches[0].clientX;
            screenPanStartY = e.touches[0].clientY;
            screenStartImgX = imgX;
            screenStartImgY = imgY;
        }
    });

    screenArea.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 2) {
            const dist = pinchDist(e.touches);
            const newScale = Math.min(8, Math.max(0.5, screenPinchStartScale * (dist / screenPinchDist)));
            imgScale = newScale;
            applyImgTransform();
        } else if (e.touches.length === 1 && imgScale > 1) {
            const dx = e.touches[0].clientX - screenPanStartX;
            const dy = e.touches[0].clientY - screenPanStartY;
            imgX = screenStartImgX + dx;
            imgY = screenStartImgY + dy;
            applyImgTransform();
        }
    });

    screenArea.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (e.touches.length === 0 && imgScale <= 1) {
            fitImage();
        }
    });

    // 双击还原
    let lastTapTime = 0;
    screenArea.addEventListener('click', () => {
        const now = Date.now();
        if (now - lastTapTime < 300) {
            fitImage();
        }
        lastTapTime = now;
    });

    function pinchDist(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    // --- 触控板逻辑 ---
    let touchStartX = 0, touchStartY = 0;
    let isTwoFinger = false;
    let tapStartTime = 0, hasMoved = false;
    let lastMoveTime = 0;
    let longPressTimer = null;
    let isLongPress = false;
    let scrollLastY = 0;
    let scrollLastTime = 0;

    touchpad.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touches = e.touches;
        if (touches.length === 1) {
            touchStartX = touches[0].clientX;
            touchStartY = touches[0].clientY;
            tapStartTime = Date.now();
            hasMoved = false;
            isTwoFinger = false;
            isLongPress = false;
            longPressTimer = setTimeout(() => {
                if (!hasMoved) {
                    isLongPress = true;
                    send({type: 'click', button: 'right'});
                    if (navigator.vibrate) navigator.vibrate(50);
                }
            }, 500);
        } else if (touches.length === 2) {
            isTwoFinger = true;
            scrollLastY = (touches[0].clientY + touches[1].clientY) / 2;
            scrollLastTime = Date.now();
            clearTimeout(longPressTimer);
        }
    });

    touchpad.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touches = e.touches;
        const now = Date.now();

        if (touches.length === 2 && isTwoFinger) {
            const currentY = (touches[0].clientY + touches[1].clientY) / 2;
            const dy = currentY - scrollLastY;
            const dt = now - scrollLastTime;
            scrollLastY = currentY;
            scrollLastTime = now;

            if (dt > 0 && dt < 200) {
                // 将像素位移按比例映射为滚动行数，负号因为手指下滑=页面下滚
                const lines = -(dy / 12);
                if (Math.abs(lines) >= 0.5) {
                    send({type: 'scroll', delta: Math.round(lines)});
                }
            }
            return;
        }

        if (touches.length === 1 && !isTwoFinger) {
            const dx = touches[0].clientX - touchStartX;
            const dy = touches[0].clientY - touchStartY;

            if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
                hasMoved = true;
                clearTimeout(longPressTimer);
                if (now - lastMoveTime > 12) {
                    send({type: 'move', dx: Math.round(dx * 1.8), dy: Math.round(dy * 1.8)});
                    lastMoveTime = now;
                }
            }
            touchStartX = touches[0].clientX;
            touchStartY = touches[0].clientY;
        }
    });

    touchpad.addEventListener('touchend', (e) => {
        e.preventDefault();
        clearTimeout(longPressTimer);
        if (!hasMoved && !isTwoFinger && !isLongPress) {
            const elapsed = Date.now() - tapStartTime;
            if (elapsed < 250) {
                send({type: 'click', button: 'left'});
            }
        }
        isTwoFinger = false;
        isLongPress = false;
    });

    touchpad.addEventListener('touchcancel', (e) => {
        clearTimeout(longPressTimer);
        isTwoFinger = false;
        isLongPress = false;
    });

    // --- 工具栏按钮 ---
    document.getElementById('btn-left').addEventListener('click', (e) => {
        e.stopPropagation();
        send({type: 'click', button: 'left'});
    });
    document.getElementById('btn-right').addEventListener('click', (e) => {
        e.stopPropagation();
        send({type: 'click', button: 'right'});
    });
    document.getElementById('btn-scroll-up').addEventListener('click', (e) => {
        e.stopPropagation();
        send({type: 'scroll', delta: 3});
    });
    document.getElementById('btn-scroll-down').addEventListener('click', (e) => {
        e.stopPropagation();
        send({type: 'scroll', delta: -3});
    });
    document.getElementById('btn-keyboard').addEventListener('click', (e) => {
        e.stopPropagation();
        kbInput.focus();
        kbInput.value = '';
    });
    document.getElementById('btn-shutdown').addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm('确定要关闭电脑端遥控服务吗？')) {
            send({type: 'shutdown'});
            statusText.textContent = '服务已关闭';
            statusDot.classList.remove('on');
        }
    });

    // --- 键盘输入 ---
    let composing = false;

    kbInput.addEventListener('compositionstart', () => { composing = true; });
    kbInput.addEventListener('compositionend', (e) => {
        composing = false;
        const val = e.data || kbInput.value;
        if (val) {
            send({type: 'text', text: val});
        }
        kbInput.value = '';
    });

    kbInput.addEventListener('input', (e) => {
        if (composing) return;
        const val = kbInput.value;
        if (val) {
            send({type: 'text', text: val});
            kbInput.value = '';
        }
    });

    kbInput.addEventListener('keydown', (e) => {
        if (composing) return;
        const specialKeys = {
            'Enter': 'enter', 'Backspace': 'backspace', 'Escape': 'escape',
            'Tab': 'tab', 'ArrowUp': 'up', 'ArrowDown': 'down',
            'ArrowLeft': 'left', 'ArrowRight': 'right', 'Delete': 'delete',
            ' ': 'space'
        };
        if (specialKeys[e.key]) {
            e.preventDefault();
            send({type: 'key', key: specialKeys[e.key]});
        }
    });

    // --- 窗口大小变化时重新适配 ---
    window.addEventListener('resize', () => {
        if (imgScale <= 1) fitImage();
    });

    // --- 启动 ---
    connect();
})();
</script>
</body>
</html>
